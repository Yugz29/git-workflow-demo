<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Team Home Page</title>
    <style>
      body {
        font-family: sans-serif;
        background: #0d1117;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .team {
        display: flex;
        gap: 40px;
      }
      .member {
        text-align: center;
      }
      .name {
        font-weight: bold;
      }
      .spotlight-avatar {
        width: 660px;
        height: 660px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="team">
      <div class="member spotlight">
        <img src="https://media.licdn.com/dms/image/v2/D4E03AQHS9mmbRmKakQ/profile-displayphoto-crop_800_800/B4EZv._UYrKAAI-/0/1769509575357?e=1790812800&v=beta&t=ljH3ukDAZ_NMJEey06Bx7pghq90HIgQ_6RMXJMXxuCw" alt="Hinoto" class="spotlight-avatar" />
        <div class="name">Hinoto</div>
      </div>
    </div>
  </body>
</html>
