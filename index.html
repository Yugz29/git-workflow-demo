<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Team Home Page</title>
    <style>
      body {
        font-family: sans-serif;
        background: #0d1117;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .team {
        display: flex;
        gap: 40px;
      }
      .member {
        text-align: center;
      }
      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #2176FF;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 10px;
      }
      .name {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="team">
      <div class="member">
        <div class="avatar">🐰</div>
        <div class="name">Yugz</div>
      </div>
      <!-- Chaque membre ajoute son propre .member ici -->
    </div>
  </body>
</html>
